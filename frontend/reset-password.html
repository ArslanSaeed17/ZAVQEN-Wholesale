<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — ZAVQEN Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="logo">ZAVQEN<span>.</span></a>
    <div class="nav-links"></div>
    <div class="nav-actions"><a href="login.html">Back to login</a></div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <div class="form-msg" id="form-msg"></div>
    <form id="reset-form">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Update Password</button>
    </form>
    <div class="auth-links">
      <a href="login.html">Back to login</a>
    </div>
  </div>
</div>

<script src="js/apiClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
