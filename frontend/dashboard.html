<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — ZAVQEN Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dashboard">

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="logo">ZAVQEN<span>.</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
    </div>
    <div class="nav-actions">
      <a href="cart.html" class="btn-cart">Cart<span class="cart-count" id="cart-count">0</span></a>
      <span id="nav-auth-slot"></span>
    </div>
  </div>
</nav>

<div class="container">
  <div class="acct-shell">

    <aside class="acct-sidebar">
      <div class="acct-sidebar-head">
        <h2>My Account</h2>
      </div>
      <nav class="acct-nav">
        <button class="dash-tab acct-nav-item active" data-tab="orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
          Orders
        </button>
        <button class="dash-tab acct-nav-item" data-tab="addresses">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22s7-7.6 7-13a7 7 0 1 0-14 0c0 5.4 7 13 7 13z"/><circle cx="12" cy="9" r="2.6"/></svg>
          Addresses
        </button>
        <button class="dash-tab acct-nav-item" data-tab="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          Profile
        </button>
      </nav>
    </aside>

    <div class="acct-content">

      <div class="dash-panel active acct-panel" id="panel-orders">
        <div class="acct-panel-head">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Orders</h3>
        </div>
        <div id="orders-list" class="acct-order-list">Loading…</div>
      </div>

      <div class="dash-panel acct-panel" id="panel-addresses">
        <div class="acct-panel-head">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22s7-7.6 7-13a7 7 0 1 0-14 0c0 5.4 7 13 7 13z"/><circle cx="12" cy="9" r="2.6"/></svg>Addresses</h3>
          <button type="button" class="btn btn-primary btn-sm" id="address-add-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Add New Address
          </button>
        </div>

        <div class="checkout-block acct-address-form-card" id="address-form-card" hidden>
          <h3 id="address-form-title">Add New Address</h3>
          <div class="form-msg" id="address-msg"></div>
          <form id="address-form">
            <input type="hidden" id="addr_edit_id" value="">
            <div class="field"><label for="addr_label">Label</label><input id="addr_label" type="text" placeholder="e.g. Warehouse, Shop"></div>
            <div class="field-row">
              <div class="field"><label for="addr_full_name">Full name</label><input id="addr_full_name" type="text" required></div>
              <div class="field"><label for="addr_phone">Phone</label><input id="addr_phone" type="tel" required></div>
            </div>
            <div class="field"><label for="addr_line1">Address line 1</label><input id="addr_line1" type="text" required></div>
            <div class="field"><label for="addr_line2">Address line 2 (optional)</label><input id="addr_line2" type="text"></div>
            <div class="field-row">
              <div class="field"><label for="addr_city">City</label><input id="addr_city" type="text" required></div>
              <div class="field"><label for="addr_state">State/Province</label><input id="addr_state" type="text"></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="addr_postal">Postal code</label><input id="addr_postal" type="text"></div>
              <div class="field"><label for="addr_country">Country</label><input id="addr_country" type="text" value="Pakistan"></div>
            </div>
            <div class="acct-form-actions">
              <button type="submit" class="btn btn-primary btn-block" id="address-submit-btn">Save Address</button>
              <button type="button" class="btn btn-outline" id="address-cancel-btn">Cancel</button>
            </div>
          </form>
        </div>

        <div id="addresses-list" class="acct-address-grid">Loading…</div>
      </div>

      <div class="dash-panel acct-panel" id="panel-profile">
        <div class="acct-panel-head">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Profile</h3>
        </div>

        <div class="acct-profile-card">
          <div class="acct-profile-side">
            <div class="acct-avatar" id="profile-avatar">—</div>
            <div class="acct-profile-name" id="profile-name-display">—</div>
            <div class="acct-profile-meta">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              Member since <span id="profile-member-since">—</span>
            </div>
          </div>

          <form id="profile-form" class="acct-profile-form">
            <div class="form-msg" id="profile-msg"></div>
            <div class="field-row">
              <div class="field field--icon">
                <label for="profile_email">Email</label>
                <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
                <input id="profile_email" type="email" disabled>
              </div>
              <div class="field field--icon">
                <label for="profile_full_name">Full name</label>
                <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></span>
                <input id="profile_full_name" type="text" required>
              </div>
            </div>
            <div class="field field--icon">
              <label for="profile_phone">Phone</label>
              <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h4l1 5-2.7 2.1a12 12 0 0 0 5.6 5.6L16 13.4l5 1v4a2 2 0 0 1-2 2C10.6 20 4 13.4 4 5a2 2 0 0 1 2-2z"/></svg></span>
              <input id="profile_phone" type="tel" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M7 3v6h8V3"/><path d="M7 21v-8h10v8"/></svg>
              Save Changes
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 ZAVQEN Wholesale. All rights reserved.</span>
      <span>Lahore, Pakistan</span>
    </div>
  </div>
</footer>

<script src="js/apiClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
