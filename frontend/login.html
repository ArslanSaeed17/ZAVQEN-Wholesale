<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — ZAVQEN Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="logo">ZAVQEN<span>.</span></a>
    <div class="nav-links"></div>
    <div class="nav-actions"><a href="register.html">New here? Create an account</a></div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to browse and order.</p>
    <div class="form-msg" id="form-msg"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
    </form>
    <div class="auth-links">
      <a href="register.html">Create an account</a>
      <a href="forgot-password.html">Forgot password?</a>
    </div>
  </div>
</div>

<script src="js/apiClient.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
