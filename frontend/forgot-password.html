<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ZAVQEN Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="logo">ZAVQEN<span>.</span></a>
    <div class="nav-links"></div>
    <div class="nav-actions"><a href="login.html">Back to login</a></div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="sub">We'll email you a link to set a new password.</p>
    <div class="form-msg" id="form-msg"></div>
    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="forgot-btn">Send reset link</button>
    </form>
    <div class="auth-links">
      <a href="login.html">Back to login</a>
    </div>
  </div>
</div>

<script src="js/apiClient.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
